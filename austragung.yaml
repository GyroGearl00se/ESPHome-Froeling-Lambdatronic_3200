sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Fuellstand im Pelletsbehaelter"
    id: ${name}_Fuellstand_im_Pelletsbehaelter
    register_type: read
    address: 21
    unit_of_measurement: "%"
    state_class: "measurement"
    accuracy_decimals: 1
    value_type: U_WORD
    filters:
      - multiply: 0.0048309178743961
      - round: 1

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Resetierbarer kg-Zaehler"
    id: ${name}_Resetierbarer_kg_Zaehler
    register_type: read
    address: 81
    unit_of_measurement: "kg"
    device_class: "weight"
    state_class: "measurement"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Resetierbarer t-Zaehler"
    id: ${name}_Resetierbarer_t_Zaehler
    register_type: read
    address: 82
    unit_of_measurement: "t"
    device_class: "weight"
    state_class: "measurement"
    value_type: U_WORD

  - platform: template
    name: "${name} Pelletverbrauch resetierbar gesamt"
    id: ${name}_Pelletverbrauch_resetierbar_gesamt
    unit_of_measurement: "kg"
    device_class: "weight"
    state_class: "total_increasing"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      float t = id(${name}_Resetierbarer_t_Zaehler).state;
      float kg = id(${name}_Resetierbarer_kg_Zaehler).state;
      if (isnan(t) || isnan(kg)) return NAN;
      return t * 1000.0f + kg;

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Pelletverbrauch Gesamt"
    id: ${name}_Pelletverbrauch_Gesamt
    register_type: read
    address: 83
    unit_of_measurement: "t"
    device_class: "weight"
    state_class: "total_increasing"
    accuracy_decimals: 1
    value_type: U_WORD
    filters:
      - multiply: 0.1

  - platform: template
    name: "${name} Pelletverbrauch Gesamt (kWh)"
    id: ${name}_Pelletverbrauch_Gesamt_kwh
    unit_of_measurement: "kWh"
    device_class: "energy"
    state_class: "total_increasing"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      const float pellet_kwh_per_kg = 4.8f; // Durchschnittlicher Heizwert ENplus A1 Pellets (kWh/kg)
      float t = id(${name}_Pelletverbrauch_Gesamt).state;
      if (isnan(t)) return NAN;
      return t * 1000.0f * pellet_kwh_per_kg;

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Pelletlager Restbestand"
    id: ${name}_Pelletlager_Restbestand
    register_type: holding
    address: 319
    unit_of_measurement: "t"
    device_class: "weight"
    state_class: "measurement"
    accuracy_decimals: 1
    value_type: U_WORD
    filters:
      - multiply: 0.1

switch:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Automatische Pelletsaustragung deaktivieren"
    id: ${name}_Automatische_Pelletsaustragung_deaktivieren
    register_type: holding
    address: 264 # Register 40265 (0 = aktiv, 1 = deaktiviert)

number:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Pelletlager Mindestbestand"
    id: ${name}_Pelletlager_Mindestbestand
    address: 335 # Register 40336 (Skalierung 10)
    unit_of_measurement: "t"
    value_type: U_WORD
    multiply: 10
    step: 0.1
    min_value: 0
    max_value: 100
