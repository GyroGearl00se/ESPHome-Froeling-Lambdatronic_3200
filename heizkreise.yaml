# templates/heizkreise.yaml  (nutzbar für HK1 bis HK18)
sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} HK${hk} - Vorlauf-Isttemperatur"
    id: ${name}_HK${hk}_Vorlauf_Isttemperatur
    register_type: read
    address: ${ 1000 + (hk | int) * 30 }
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    value_type: U_WORD
    filters:
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} HK${hk} - Vorlauf-Solltemperatur"
    id: ${name}_HK${hk}_Vorlauf_Solltemperatur
    register_type: read
    address: ${ 1001 + (hk | int) * 30 }
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    value_type: U_WORD
    filters:
      - multiply: 0.5

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} HK${hk} - Pumpe AN AUS"
    id: ${name}_HK${hk}_Pumpe_AN_AUS
    register_type: coil
    address: ${ 999 + (hk | int) * 30 }

number:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} HK${hk} - Gewünschte Vorlauf-temperatur bei +10°C Außentemperatur"
    id: ${name}_HK${hk}_Vorlauf_Temperatur_10C_Aussentemperatur
    address: ${ 1001 + (hk | int) * 30 }
    unit_of_measurement: "°C"
    value_type: U_WORD
    multiply: 2
    min_value: 10
    max_value: 110

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} HK${hk} - Gewünschte Vorlauf-temperatur bei -10°C Außentemperatur"
    id: ${name}_HK${hk}_Vorlauf_Temperatur_minus_10C_Aussentemperatur
    address: ${ 1002 + (hk | int) * 30 }
    unit_of_measurement: "°C"
    value_type: U_WORD
    multiply: 2
    min_value: 10
    max_value: 110

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} HK${hk} - Absenkung der Vorlauftemperatur im Absenkbetrieb"
    id: ${name}_HK${hk}_Absenkung_der_Vorlauftemperatur_im_Absenkbetrieb
    address: ${ 1003 + (hk | int) * 30 }
    unit_of_measurement: "°C"
    value_type: U_WORD
    multiply: 2
    min_value: 0
    max_value: 70

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} HK${hk} - Außentemperatur, unter der die Heizkreispumpe im Heizbetrieb einschaltet"
    id: ${name}_HK${hk}_Aussentemperatur_unter_der_die_Heizkreispumpe_im_Heizbetrieb_einschaltet
    address: ${ 1006 + (hk | int) * 30 }
    unit_of_measurement: "°C"
    value_type: S_WORD
    multiply: 2
    min_value: -20
    max_value: 50

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} HK${hk} - Außentemperatur, unter der die Heizkreispumpe im Absenkbetrieb einschaltet"
    id: ${name}_HK${hk}_Aussentemperatur_unter_der_die_Heizkreispumpe_im_Absenkbetrieb_einschaltet
    address: ${ 1007 + (hk | int) * 30 }
    unit_of_measurement: "°C"
    value_type: S_WORD
    multiply: 2
    min_value: -20
    max_value: 50

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} HK${hk} - Frostschutztemperatur"
    id: ${name}_HK${hk}_Frostschutztemperatur
    address: ${ 1008 + (hk | int) * 30 }
    unit_of_measurement: "°C"
    value_type: S_WORD
    multiply: 2
    min_value: -10
    max_value: 20

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} HK${hk} - Heizkreispumpe ausschalten wenn Vorlauf Soll kleiner ist als"
    id: ${name}_HK${hk}_Heizkreispumpe_ausschalten_wenn_Vorlauf_Soll_kleiner_ist_als
    address: ${ 1009 + (hk | int) * 30 }
    unit_of_measurement: "°C"
    value_type: U_WORD
    multiply: 2
    min_value: 10
    max_value: 30

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} HK${hk} - Temp. am Puffer oben ab der der Überhitzungsschutz aktiv wird"
    id: ${name}_HK${hk}_Temp_am_Puffer_oben_ab_der_der_Ueberhitzungsschutz_aktiv_wird
    address: ${ 1047 if (hk | int) == 1 else (1078 if (hk | int) == 2 else 1015 + (hk | int) * 30) }
    unit_of_measurement: "°C"
    value_type: U_WORD
    min_value: 60
    max_value: 120

select:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} HK${hk} - Betriebsart"
    id: ${name}_HK${hk}_Betriebsart
    address: ${ 8045 + (hk | int) }
    value_type: U_WORD
    optionsmap:
      "Aus": 0
      "Automatik": 1
      "Extraheizen": 2
      "Absenken": 3
      "Dauerabsenken": 4
      "Partybetrieb": 5
    lambda: |-
      switch (x) {
        case 6:  return std::string("Partybetrieb");
        case 11: return std::string("Aus");
        case 12: return std::string("Dauerabsenken");
        default: return {};
      }
