    address: 62
    unit_of_measurement: "h"
    state_class: "total_increasing"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Stunden im Heizen"
    id: ${name}_Stunden_im_Heizen
    register_type: read
    address: 63
    unit_of_measurement: "h"
    state_class: "total_increasing"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Stunden in Teillastbetrieb"
    id: ${name}_Stunden_in_Teillastbetrieb
    register_type: read
    address: 74
    unit_of_measurement: "h"
    state_class: "total_increasing"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Stunden im Scheitholzbetrieb"
    id: ${name}_Stunden_im_Scheitholzbetrieb
    register_type: read
    address: 76
