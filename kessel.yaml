    state_class: "total_increasing"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Zustandslaufzeit aktuell"
    id: ${name}_Zustandslaufzeit_aktuell
    register_type: read
    address: 2300 # Register 32301 (Sekunden im aktuellen Kesselzustand)
    unit_of_measurement: "s"
    device_class: "duration"
    state_class: "measurement"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Zustandslaufzeit maximal"
    id: ${name}_Zustandslaufzeit_maximal
    register_type: read
    address: 2301 # Register 32302 (maximale Dauer der aktuellen Phase in Sekunden)
    unit_of_measurement: "s"
    device_class: "duration"
    state_class: "measurement"
    value_type: U_WORD

switch:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Automatisch Zünden"
    id: ${name}_Automatisch_Zuenden
    register_type: holding
    address: 135 # Register 40136 (0 = Aus, 1 = Ein, z.B. SP Dual / S4 Zündautomatik)

number:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Nach Scheitholzbetrieb Pufferladung mit Pellets verzögern"
    id: ${name}_Pufferladung_Pellets_verzoegern
    address: 251 # Register 40252 (0..24 h, Skalierung 10)
    unit_of_measurement: "h"
    value_type: U_WORD
    multiply: 10
    step: 0.5
    min_value: 0
    max_value: 24

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Kesselanforderung"
    id: ${name}_Kesselanforderung
    register_type: read
    address: 56 # Register 30057: Kesselanforderung über Heizkreis oder Boiler steht an
    bitmask: 1

  - platform: template
    name: "${name} Kesselzustand Heizen"
    id: ${name}_Kesselzustand_Heizen
    lambda: |-
      const auto &s = id(${name}_Kesselzustand).state;
      return (s == "Heizen" || s == "SH Heizen" || s == "Saugen / Heizen" || s == "Heizen - Reinigen");

  - platform: template
    name: "${name} Kessel Störung"
    id: ${name}_Kesselzustand_Stoerung
    device_class: "problem"
    lambda: |-
      const auto &s = id(${name}_Kesselzustand).state;
      return (s == "STÖRUNG" || s == "Fehlzündung" || s == "SH Störung" ||
              s == "Fehlerbeh. 20min" ||
              s.rfind("STÖRUNG", 0) == 0 || s.rfind("FEHLER", 0) == 0);

text_sensor:
  - platform: template
    name: "${name} Kessel Statusgruppe"
    id: ${name}_Kessel_Statusgruppe
    update_interval: 30s
    lambda: |-
      const auto &s = id(${name}_Kesselzustand).state;
      if (s.empty()) return std::string("Unbekannt");
      if (s == "STÖRUNG" || s == "Fehlzündung" || s == "SH Störung" ||
          s == "Fehlerbeh. 20min" ||
          s.rfind("STÖRUNG", 0) == 0 || s.rfind("FEHLER", 0) == 0)
        return std::string("Störung");
      if (s == "Tür offen" || s == "NB: Tür offen")
        return std::string("Tür offen");
      if (s == "Heizen" || s == "SH Heizen" || s == "Saugen / Heizen" ||
          s == "Heizen - Reinigen" || s == "NB: Heizen" || s == "Feuererhaltung")
        return std::string("Heizen");
      if (s == "Anheizen" || s == "Vorbereitung" || s == "Vorwärmen" ||
          s == "Zünden" || s == "Vorheizen" || s == "Vorwärmen-Zünden" ||
          s == "Nachzünden" || s == "Zünden Warten" || s == "Vorbelüften" ||
          s == "SH Anheizen" || s == "SH Zünden" || s == "NB: Anheizen" ||
          s == "Lambdasonde aufheizen" || s == "Anheizassistent" ||
          s == "Stoker auffüllen" || s == "Saugen")
        return std::string("Start / Zünden");
      if (s == "Abreinigen" || s == "Rost schließen" || s == "Rost kippen" ||
          s == "Stoker leeren" || s == "Resteinschub" || s == "AGR Nachlauf" ||
          s == "AGR reinigen" || s == "Filter reinigen" || s == "Gebläsenachlauf I" ||
          s == "Gebläsenachlauf II" || s == "SH Heiz/Abstell" ||
          s.rfind("Abstellen", 0) == 0 || s.rfind("RSE ", 0) == 0 || s.rfind("FB: ", 0) == 0)
        return std::string("Abreinigen / Abstellen");
      return std::string("Bereit / Aus");
