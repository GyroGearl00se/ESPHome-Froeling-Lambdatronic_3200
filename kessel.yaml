    address: 27
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    value_type: S_WORD
    filters:
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Kesselstellgröße"
    id: ${name}_Kesselstellgroesse
    register_type: read
    address: 14
    unit_of_measurement: "%"
    state_class: "measurement"
