sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Kesseltemperatur"
    id: ${name}_Kesseltemperatur
    register_type: read
    address: 0
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    value_type: S_WORD
    filters:
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Abgastemperatur"
    id: ${name}_Abgastemperatur
    register_type: read
    address: 1
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    value_type: S_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Boardtemperatur"
    id: ${name}_Boardtemperatur
    register_type: read
    address: 2
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    value_type: S_WORD
    filters:
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Errechnete Kesselsolltemperatur"
    id: ${name}_Errechnete_Kesselsolltemperatur
    register_type: read
    address: 27
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    value_type: S_WORD
    filters:
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Kesselstellgröße"
    id: ${name}_Kesselstellgroesse
    register_type: read
    address: 14
    unit_of_measurement: "%"
    state_class: "measurement"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Verbleibende Heizstunden bis zur Asche entleeren Warnung"
    id: ${name}_Verbleibende_Heizstunden_bis_zur_Asche_entleeren_Warnung
    register_type: read
    address: 86
    unit_of_measurement: "h"
    state_class: "measurement"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Saugzug - Ansteuerung"
    id: ${name}_Saugzug_Ansteuerung
    register_type: read
    address: 13
    unit_of_measurement: "%"
    state_class: "measurement"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Saugzugdrehzahl"
    id: ${name}_Saugzugdrehzahl
    register_type: read
    address: 6
    unit_of_measurement: "rpm"
    state_class: "measurement"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Sauerstoffregler"
    id: ${name}_Sauerstoffregler
    register_type: read
    address: 16
    unit_of_measurement: "%"
    state_class: "measurement"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Restsauerstoffgehalt"
    id: ${name}_Restsauerstoffgehalt
    register_type: read
    address: 3
    unit_of_measurement: "%"
    state_class: "measurement"
    accuracy_decimals: 1
    value_type: U_WORD
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Rücklauffühler"
    id: ${name}_Ruecklauffuehler
    register_type: read
    address: 9
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    value_type: S_WORD
    filters:
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Primärluft"
    id: ${name}_Primaerluft
    register_type: read
    address: 11
    unit_of_measurement: "%"
    state_class: "measurement"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Sekundärluft"
    id: ${name}_Sekundaerluft
    register_type: read
    address: 12
    unit_of_measurement: "%"
    state_class: "measurement"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Betriebsstunden"
    id: ${name}_Betriebsstunden
    register_type: read
    address: 20
    unit_of_measurement: "h"
    state_class: "total_increasing"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Anzahl der Brennerstarts"
    id: ${name}_Anzahl_der_Brennerstarts
    register_type: read
    address: 22
    state_class: "total_increasing"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Stunden seit letzter Wartung"
    id: ${name}_Stunden_seit_letzter_Wartung
    register_type: read
    address: 55
    unit_of_measurement: "h"
    state_class: "total_increasing"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Betriebsstunden in der Feuererhaltung"
    id: ${name}_Betriebsstunden_in_der_Feuererhaltung
    register_type: read
    address: 24
    unit_of_measurement: "h"
    state_class: "total_increasing"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Stunden im Pelletsbetrieb"
    id: ${name}_Stunden_im_Pelletsbetrieb
    register_type: read
    address: 62
    unit_of_measurement: "h"
    state_class: "total_increasing"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Stunden im Heizen"
    id: ${name}_Stunden_im_Heizen
    register_type: read
    address: 63
    unit_of_measurement: "h"
    state_class: "total_increasing"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Stunden in Teillastbetrieb"
    id: ${name}_Stunden_in_Teillastbetrieb
    register_type: read
    address: 74
    unit_of_measurement: "h"
    state_class: "total_increasing"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Stunden im Scheitholzbetrieb"
    id: ${name}_Stunden_im_Scheitholzbetrieb
    register_type: read
    address: 76
    unit_of_measurement: "h"
    state_class: "total_increasing"
    value_type: U_WORD

switch:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Automatisch Zünden"
    id: ${name}_Automatisch_Zuenden
    register_type: holding
    address: 135 # Register 40136 (0 = Aus, 1 = Ein, z.B. SP Dual / S4 Zündautomatik)

number:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Nach Scheitholzbetrieb Pufferladung mit Pellets verzögern"
    id: ${name}_Pufferladung_Pellets_verzoegern
    address: 251 # Register 40252 (0..24 h, Skalierung 10)
    unit_of_measurement: "h"
    value_type: U_WORD
    multiply: 10
    step: 0.5
    min_value: 0
    max_value: 24

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Kesselanforderung"
    id: ${name}_Kesselanforderung
    register_type: read
    address: 56 # Register 30057: Kesselanforderung über Heizkreis oder Boiler steht an
    bitmask: 1

  - platform: template
    name: "${name} Kesselzustand Heizen"
    id: ${name}_Kesselzustand_Heizen
    lambda: |-
      const auto &s = id(${name}_Kesselzustand).state;
      return (s == "Heizen" || s == "SH Heizen" || s == "Saugen / Heizen" || s == "Heizen - Reinigen");
